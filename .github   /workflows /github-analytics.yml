name: Update GitHub Analytics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/generate_analytics.py"
      - ".github/workflows/github-analytics.yml"

permissions:
  contents: write

concurrency:
  group: github-analytics
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify analytics secret exists
        env:
          GH_ANALYTICS_TOKEN: ${{ secrets.GH_ANALYTICS_TOKEN }}
        run: |
          if [ -z "$GH_ANALYTICS_TOKEN" ]; then
            echo "ERROR: GH_ANALYTICS_TOKEN secret is missing or empty."
            exit 1
          fi
          echo "GH_ANALYTICS_TOKEN is present. Token value will not be displayed."

      - name: Generate and validate analytics
        env:
          GH_ANALYTICS_TOKEN: ${{ secrets.GH_ANALYTICS_TOKEN }}
        run: python scripts/generate_analytics.py

      - name: Show generated file sizes
        run: |
          ls -lh assets/analytics/
          test -s assets/analytics/overview.svg
          test -s assets/analytics/languages.svg
          test -s assets/analytics/contributions.svg
          test -s assets/analytics/activity.svg
          test -s assets/analytics/metrics.json

      - name: Commit and push analytics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/analytics/
          if git diff --cached --quiet; then
            echo "Analytics files are already up to date."
          else
            git commit -m "chore: update GitHub analytics"
            git push origin HEAD:main
          fi
