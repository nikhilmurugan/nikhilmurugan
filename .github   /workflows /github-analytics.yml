name: Update GitHub Analytics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: github-analytics
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify analytics secret
        env:
          GH_ANALYTICS_TOKEN: ${{ secrets.GH_ANALYTICS_TOKEN }}
        run: |
          if [ -z "$GH_ANALYTICS_TOKEN" ]; then
            echo "::error::GH_ANALYTICS_TOKEN repository secret is missing or empty."
            exit 1
          fi
          echo "Analytics token secret is present."

      - name: Generate analytics
        env:
          GH_ANALYTICS_TOKEN: ${{ secrets.GH_ANALYTICS_TOKEN }}
        run: python scripts/generate_analytics.py

      - name: Validate generated files
        run: |
          set -e
          for file in \
            assets/analytics/overview.svg \
            assets/analytics/languages.svg \
            assets/analytics/contributions.svg \
            assets/analytics/activity.svg \
            assets/analytics/metrics.json
          do
            test -s "$file" || { echo "::error::Missing or empty file: $file"; exit 1; }
          done
          python -m json.tool assets/analytics/metrics.json > /dev/null
          grep -q '<svg' assets/analytics/overview.svg
          grep -q '</svg>' assets/analytics/overview.svg
          echo "All analytics files exist and are non-empty."

      - name: Commit and push analytics
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/analytics/
          if git diff --cached --quiet; then
            echo "Analytics files are already up to date."
          else
            git commit -m "chore: update GitHub analytics"
            git push origin HEAD:main
          fi
