<svg xmlns="http://www.w3.org/2000/svg"
    width="620" height="180"
    viewBox="0 0 620 180"
    role="img" aria-label="Contribution Summary">
    <defs>
      <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#38BDF8"/>
        <stop offset="52%" stop-color="#818CF8"/>
        <stop offset="100%" stop-color="#E879F9"/>
      </linearGradient>
      <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#142440"/>
        <stop offset="100%" stop-color="#0D172A"/>
      </linearGradient>
      <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#38BDF8"/>
        <stop offset="100%" stop-color="#A78BFA"/>
      </linearGradient>
    </defs>

    <rect width="100%" height="100%" rx="16" fill="#080F1D"/>
    <rect x="1" y="1" width="618" height="178"
          rx="15" fill="none" stroke="#263B60" stroke-width="1"/>

    <text x="26" y="38" fill="#F1F5FF"
          font-size="21" font-family="Arial,sans-serif"
          font-weight="700">Contribution Summary</text>

    <text x="26" y="61" fill="#A6B5D0"
          font-size="11" font-family="Arial,sans-serif">
          GitHub contribution calendar · Recent 365-day period
    </text>
    
    <rect x="22" y="78" width="133" height="82"
          rx="12" fill="url(#panel)" stroke="#263B60"/>

    <rect x="23" y="79" width="3" height="80"
          rx="2" fill="#38BDF8"/>

    <text x="39" y="107" fill="#A6B5D0"
          font-size="12" font-family="Arial,sans-serif">
          Contributions
    </text>

    <text x="39" y="144" fill="#38BDF8"
          font-size="28" font-weight="700"
          font-family="Arial,sans-serif">
          60
    </text>
    
    <rect x="165" y="78" width="133" height="82"
          rx="12" fill="url(#panel)" stroke="#263B60"/>

    <rect x="166" y="79" width="3" height="80"
          rx="2" fill="#34D399"/>

    <text x="182" y="107" fill="#A6B5D0"
          font-size="12" font-family="Arial,sans-serif">
          Current Streak
    </text>

    <text x="182" y="144" fill="#34D399"
          font-size="28" font-weight="700"
          font-family="Arial,sans-serif">
          2
    </text>
    
    <rect x="308" y="78" width="133" height="82"
          rx="12" fill="url(#panel)" stroke="#263B60"/>

    <rect x="309" y="79" width="3" height="80"
          rx="2" fill="#A78BFA"/>

    <text x="325" y="107" fill="#A6B5D0"
          font-size="12" font-family="Arial,sans-serif">
          Longest Streak
    </text>

    <text x="325" y="144" fill="#A78BFA"
          font-size="28" font-weight="700"
          font-family="Arial,sans-serif">
          2
    </text>
    
    <rect x="451" y="78" width="133" height="82"
          rx="12" fill="url(#panel)" stroke="#263B60"/>

    <rect x="452" y="79" width="3" height="80"
          rx="2" fill="#E879F9"/>

    <text x="468" y="107" fill="#A6B5D0"
          font-size="12" font-family="Arial,sans-serif">
          Active Days
    </text>

    <text x="468" y="144" fill="#E879F9"
          font-size="28" font-weight="700"
          font-family="Arial,sans-serif">
          10
    </text>
    
</svg>
